name: Build and deploy VitePress documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/hyper-v/scom-mp/**'
      - 'tests/**'
      - '.github/workflows/deploy-docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/hyper-v/scom-mp/**'
      - 'tests/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mp-contract:
    name: Validate Hyper-V MP source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Run Management Pack unit and contract tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests/unit -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Management Pack test(s) failed."
          }

  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run docs:build

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, mp-contract]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
