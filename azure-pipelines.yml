# Azure DevOps Pipeline Trigger for hybrid-health-monitoring
# Governed centrally in HCS Platform Engineering

trigger:
  branches:
    include:
      - main
      - master
      - feature/*

pr:
  branches:
    include:
      - main
      - master

resources:
  repositories:
    - repository: platform
      type: git
      name: Platform Engineering/platform

extends:
  template: .ado/pipelines/reusable/vitepress-deploy.yml@platform
  parameters:
    docsPath: 'docs'
    nodeVersion: '20.x'
