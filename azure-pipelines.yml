# Azure DevOps Pipeline Trigger for azurelocal-scom-mp
# Governed centrally in HCS Platform Engineering

trigger:
  branches:
    include:
      - main
      - master
      - feature/*

pr:
  branches:
    include:
      - main
      - master

resources:
  repositories:
    - repository: platform
      type: git
      name: Platform Engineering/platform

extends:
  template: .ado/pipelines/reusable/ps-module-ci.yml@platform
  parameters:
    moduleName: 'azurelocal-scom-mp'
    runMaproomTests: true
