<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Azure Local SCOM architecture</title><desc id="desc">Local Azure Local sources flow through SCOM agent discovery and monitoring into sealed management packs and a six-component Distributed Application. Azure Monitor remains independent.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2f"/><stop offset="1" stop-color="#123d63"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#65d3ff"/></marker></defs>
<rect width="1200" height="470" rx="24" fill="url(#bg)"/><text x="54" y="55" fill="#fff" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Azure Local SCOM · local-runtime architecture</text><text x="54" y="84" fill="#a9cbe6" font-family="Segoe UI,Arial" font-size="15">No interactive Azure sign-in or cloud credential in the core agent workflows</text>
<g filter="url(#shadow)" font-family="Segoe UI,Arial"><rect x="50" y="125" width="245" height="265" rx="18" fill="#102d48" stroke="#2f86c8"/><text x="72" y="161" fill="#65d3ff" font-size="14" font-weight="700">LOCAL SOURCES</text><text x="72" y="199" fill="#fff" font-size="17">Failover Clustering</text><text x="72" y="232" fill="#fff" font-size="17">Health Service + Storage</text><text x="72" y="265" fill="#fff" font-size="17">Network ATC</text><text x="72" y="298" fill="#fff" font-size="17">Registration + Updates</text><text x="72" y="331" fill="#fff" font-size="17">Services, events, counters</text>
<rect x="350" y="125" width="245" height="265" rx="18" fill="#113853" stroke="#28a7c7"/><text x="372" y="161" fill="#65d3ff" font-size="14" font-weight="700">SCOM AGENT</text><text x="372" y="203" fill="#fff" font-size="17">Role seed</text><text x="372" y="239" fill="#fff" font-size="17">Topology discovery</text><text x="372" y="275" fill="#fff" font-size="17">Shared cooked-down probe</text><text x="372" y="311" fill="#fff" font-size="17">Events + performance</text><text x="372" y="347" fill="#8fe3b6" font-size="15">Pipeline health is explicit</text>
<rect x="650" y="125" width="245" height="265" rx="18" fill="#17395f" stroke="#6b8cff"/><text x="672" y="161" fill="#9cadff" font-size="14" font-weight="700">SEALED SUITE</text><text x="672" y="198" fill="#fff" font-size="17">Library</text><text x="672" y="230" fill="#fff" font-size="17">Discovery</text><text x="672" y="262" fill="#fff" font-size="17">Monitoring</text><text x="672" y="294" fill="#fff" font-size="17">Presentation</text><text x="672" y="326" fill="#fff" font-size="17">Optional Reporting</text>
<rect x="950" y="125" width="200" height="265" rx="18" fill="#164459" stroke="#3bd0b3"/><text x="972" y="161" fill="#75efd4" font-size="14" font-weight="700">SERVICE HEALTH</text><text x="972" y="204" fill="#fff" font-size="17">Compute</text><text x="972" y="235" fill="#fff" font-size="17">Storage</text><text x="972" y="266" fill="#fff" font-size="17">Network</text><text x="972" y="297" fill="#fff" font-size="17">Azure Integration</text><text x="972" y="328" fill="#fff" font-size="17">Lifecycle</text><text x="972" y="359" fill="#fff" font-size="17">Monitoring Pipeline</text></g>
<path d="M295 258h42" stroke="#65d3ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M595 258h42" stroke="#65d3ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M895 258h42" stroke="#65d3ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="650" y="410" width="500" height="36" rx="18" fill="#0b2237" stroke="#4d7596" stroke-dasharray="6 5"/><text x="900" y="434" text-anchor="middle" fill="#b9d2e7" font-family="Segoe UI,Arial" font-size="14">Independent Azure Monitor health model owns cloud resources, metrics, logs and Resource Health</text>
</svg>
