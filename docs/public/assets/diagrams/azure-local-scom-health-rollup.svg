<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title"><title id="title">Azure Local SCOM health rollup</title><defs><linearGradient id="bg4"><stop stop-color="#07192b"/><stop offset="1" stop-color="#153753"/></linearGradient><marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#6bdcff"/></marker></defs><rect width="1200" height="610" rx="24" fill="url(#bg4)"/><text x="52" y="52" fill="white" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Domain-specific health rollup</text><text x="52" y="80" fill="#accbe2" font-family="Segoe UI,Arial" font-size="15">One shared acquisition · six node aggregates · six DA components · one service state</text>
